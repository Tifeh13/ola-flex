<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="400" y2="500">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="case" x1="140" y1="120" x2="260" y2="380">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="30%" stop-color="#1a1a1a"/>
      <stop offset="70%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="bezel" x1="140" y1="130" x2="260" y2="370">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="50%" stop-color="#b8922e"/>
      <stop offset="100%" stop-color="#8a6a1a"/>
    </linearGradient>
    <linearGradient id="dial" x1="160" y1="150" x2="240" y2="350">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="strap" x1="170" y1="0" x2="230" y2="500">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="goldHand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a843"/>
      <stop offset="100%" stop-color="#b8922e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Subtle radial highlight -->
  <circle cx="200" cy="250" r="180" fill="radial-gradient(circle, rgba(212,168,67,0.03) 0%, transparent 70%)"/>
  <ellipse cx="200" cy="250" rx="180" ry="180" fill="none" stroke="rgba(212,168,67,0.02)" stroke-width="1"/>

  <!-- Strap top -->
  <rect x="172" y="30" width="56" height="140" rx="4" fill="url(#strap)"/>
  <rect x="175" y="30" width="2" height="140" fill="rgba(255,255,255,0.03)"/>
  <rect x="178" y="30" width="44" height="140" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  <!-- Strap stitching top -->
  <line x1="176" y1="40" x2="176" y2="160" stroke="rgba(212,168,67,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="224" y1="40" x2="224" y2="160" stroke="rgba(212,168,67,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Strap bottom -->
  <rect x="172" y="330" width="56" height="140" rx="4" fill="url(#strap)"/>
  <rect x="175" y="330" width="2" height="140" fill="rgba(255,255,255,0.03)"/>
  <!-- Strap stitching bottom -->
  <line x1="176" y1="340" x2="176" y2="460" stroke="rgba(212,168,67,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="224" y1="340" x2="224" y2="460" stroke="rgba(212,168,67,0.15)" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- Case body -->
  <circle cx="200" cy="250" r="110" fill="url(#case)" filter="url(#shadow)"/>

  <!-- Case edge highlight -->
  <circle cx="200" cy="250" r="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Bezel -->
  <circle cx="200" cy="250" r="100" fill="none" stroke="url(#bezel)" stroke-width="3"/>

  <!-- Bezel inner ring -->
  <circle cx="200" cy="250" r="96" fill="none" stroke="rgba(212,168,67,0.2)" stroke-width="0.5"/>

  <!-- Dial background -->
  <circle cx="200" cy="250" r="93" fill="url(#dial)"/>

  <!-- Dial texture - concentric circles -->
  <circle cx="200" cy="250" r="85" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.3"/>
  <circle cx="200" cy="250" r="75" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.3"/>
  <circle cx="200" cy="250" r="65" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.3"/>
  <circle cx="200" cy="250" r="55" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.3"/>
  <circle cx="200" cy="250" r="45" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.3"/>

  <!-- Hour markers -->
  <rect x="198" y="162" width="4" height="14" rx="1" fill="#d4a843"/>
  <rect x="198" y="324" width="4" height="14" rx="1" fill="#d4a843"/>
  <rect x="112" y="248" width="14" height="4" rx="1" fill="#d4a843"/>
  <rect x="274" y="248" width="14" height="4" rx="1" fill="#d4a843"/>

  <!-- Minor hour markers -->
  <rect x="140" y="178" width="3" height="10" rx="1" fill="rgba(212,168,67,0.5)" transform="rotate(-60,141.5,183)"/>
  <rect x="257" y="178" width="3" height="10" rx="1" fill="rgba(212,168,67,0.5)" transform="rotate(60,258.5,183)"/>
  <rect x="140" y="312" width="3" height="10" rx="1" fill="rgba(212,168,67,0.5)" transform="rotate(60,141.5,317)"/>
  <rect x="257" y="312" width="3" height="10" rx="1" fill="rgba(212,168,67,0.5)" transform="rotate(-60,258.5,317)"/>

  <!-- More minor markers -->
  <rect x="168" y="166" width="2" height="8" rx="0.5" fill="rgba(212,168,67,0.3)" transform="rotate(-30,169,170)"/>
  <rect x="230" y="166" width="2" height="8" rx="0.5" fill="rgba(212,168,67,0.3)" transform="rotate(30,231,170)"/>
  <rect x="168" y="326" width="2" height="8" rx="0.5" fill="rgba(212,168,67,0.3)" transform="rotate(30,169,330)"/>
  <rect x="230" y="326" width="2" height="8" rx="0.5" fill="rgba(212,168,67,0.3)" transform="rotate(-30,231,330)"/>

  <!-- Minute ticks -->
  <line x1="200" y1="158" x2="200" y2="163" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <line x1="200" y1="337" x2="200" y2="342" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <line x1="108" y1="250" x2="113" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <line x1="287" y1="250" x2="292" y2="250" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>

  <!-- Brand name on dial -->
  <text x="200" y="210" text-anchor="middle" fill="rgba(212,168,67,0.7)" font-family="Georgia, serif" font-size="10" letter-spacing="3" font-weight="400">OLAFLEX</text>

  <!-- Sub-dial decoration -->
  <circle cx="200" cy="290" r="20" fill="none" stroke="rgba(212,168,67,0.15)" stroke-width="0.5"/>
  <text x="200" y="293" text-anchor="middle" fill="rgba(212,168,67,0.3)" font-family="Georgia, serif" font-size="6" letter-spacing="1">AUTOMATIC</text>

  <!-- Hour hand -->
  <polygon points="197,250 200,185 203,250" fill="url(#goldHand)" filter="url(#glow)"/>
  <line x1="200" y1="250" x2="200" y2="185" stroke="#d4a843" stroke-width="3" stroke-linecap="round"/>

  <!-- Minute hand -->
  <polygon points="198.5,250 200,165 201.5,250" fill="rgba(212,168,67,0.9)" filter="url(#glow)"/>
  <line x1="200" y1="250" x2="200" y2="165" stroke="#d4a843" stroke-width="2" stroke-linecap="round"/>

  <!-- Second hand -->
  <line x1="200" y1="280" x2="200" y2="170" stroke="#d4a843" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Center cap -->
  <circle cx="200" cy="250" r="5" fill="#d4a843"/>
  <circle cx="200" cy="250" r="3" fill="#b8922e"/>
  <circle cx="200" cy="250" r="1.5" fill="#d4a843"/>

  <!-- Crown -->
  <rect x="310" y="244" width="14" height="12" rx="2" fill="#2a2a2a" stroke="#d4a843" stroke-width="0.8"/>
  <line x1="313" y1="246" x2="313" y2="254" stroke="rgba(212,168,67,0.3)" stroke-width="0.5"/>
  <line x1="315" y1="246" x2="315" y2="254" stroke="rgba(212,168,67,0.3)" stroke-width="0.5"/>
  <line x1="317" y1="246" x2="317" y2="254" stroke="rgba(212,168,67,0.3)" stroke-width="0.5"/>
  <line x1="319" y1="246" x2="319" y2="254" stroke="rgba(212,168,67,0.3)" stroke-width="0.5"/>
  <line x1="321" y1="246" x2="321" y2="254" stroke="rgba(212,168,67,0.3)" stroke-width="0.5"/>

  <!-- Crystal reflection -->
  <ellipse cx="185" cy="210" rx="40" ry="25" fill="rgba(255,255,255,0.02)" transform="rotate(-20,185,210)"/>

  <!-- Bottom text -->
  <text x="200" y="475" text-anchor="middle" fill="rgba(212,168,67,0.25)" font-family="Georgia, serif" font-size="10" letter-spacing="5">OLAFLEX</text>
</svg>
